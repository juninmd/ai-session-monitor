[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# Versions below were read from crates.io on 2026-10-10. Direct crates published within the last
# day are deliberately not pinned in Cargo.lock, except for documented owner-approved
# security fixes (see docs/adr/0001-architecture.md).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
tempfile = "3"

usage-model = { path = "crates/usage-model" }
usage-support = { path = "crates/usage-support" }
collector-claude = { path = "crates/collector-claude" }
collector-codex = { path = "crates/collector-codex" }
collector-antigravity = { path = "crates/collector-antigravity" }
collector-litellm = { path = "crates/collector-litellm" }
collector-opencode = { path = "crates/collector-opencode" }
collector-kimi = { path = "crates/collector-kimi" }
collector-zai = { path = "crates/collector-zai" }
collector-openrouter = { path = "crates/collector-openrouter" }
collector-deepseek = { path = "crates/collector-deepseek" }
collector-deepinfra = { path = "crates/collector-deepinfra" }
collector-moonshot = { path = "crates/collector-moonshot" }
collector-novita = { path = "crates/collector-novita" }
collector-ollama = { path = "crates/collector-ollama" }
collector-minimax = { path = "crates/collector-minimax" }
collector-copilot = { path = "crates/collector-copilot" }
collector-cursor = { path = "crates/collector-cursor" }
app-core = { path = "crates/app-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
