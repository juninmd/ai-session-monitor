[package]
name = "usage-support"
description = "Shared plumbing for collectors: safe HTTP client, atomic file writes, bounded child processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
usage-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `rustls` (aws-lc-rs provider) builds on MSVC without cmake/nasm: its `aws_lc_rs` feature enables
# aws-lc-sys `prebuilt-nasm`. HTTP/2, cookies, compression and the json/stream features stay off
# on purpose: every poll is one small JSON GET/POST over a fresh HTTP/1.1 connection. System
# proxies are switched off in code (`no_proxy`), since a proxy would capture the credentials.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Only for `rustls::Error`, to tell a TLS failure from a network one in the error chain.
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
minisign-verify = "=0.3.0"
base64 = "=0.23.1"
semver = "=1.0.28"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
# Dev-only TLS test server (certificates are generated per run, no key material is committed).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }

# Peer process for the `proc` integration tests; Cargo exposes its path as CARGO_BIN_EXE_test_peer.
[[bin]]
name = "test_peer"
path = "tests/support/test_peer.rs"
test = false

[lints]
workspace = true
