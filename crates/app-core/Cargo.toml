[package]
name = "app-core"
description = "Window-free core of the tray app: settings, secrets, scheduling, snapshot hub, notification planning and the IPC command logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
usage-model.workspace = true
usage-support.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Host extraction for the settings validator; already in the tree through reqwest (MIT OR Apache-2.0).
url = "2.5.8"
# The local UTC offset for quiet hours: a safe API over the OS zone data, already in the tree.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
# The recording sink serializes what it was told, to check that no secret is in any payload.
tempfile.workspace = true
# Paused virtual time for the scheduler tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
