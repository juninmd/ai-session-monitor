[package]
name = "collector-litellm"
description = "LiteLLM collector: key/user/team budget over the proxy REST API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
usage-model.workspace = true
usage-support.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The loopback fake proxy needs TcpListener; test-util lets a unit test spend the poll budget
# without waiting for it.
tokio = { workspace = true, features = ["net", "test-util"] }
# Throwaway CA and TLS server for the CustomCa/Insecure end-to-end tests: certificates are generated
# per run, no key material is committed. Same versions as usage-support's dev-dependencies.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }

[lints]
workspace = true
