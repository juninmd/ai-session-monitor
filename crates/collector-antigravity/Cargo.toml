[package]
name = "collector-antigravity"
description = "Antigravity collector: local language-server quota reader (unofficial)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
usage-model.workspace = true
usage-support.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Process API only (`system`): disks, networks, users and rayon stay off. It reads the command line of
# the matching language-server processes in-process, so a poll never spawns a script interpreter.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
# Dev-only HTTPS stand-in for the language server: a throwaway self-signed certificate per run,
# nothing committed. Same versions and features as the usage-support tests.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }

[lints]
workspace = true
