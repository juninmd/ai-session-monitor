[package]
name = "collector-cursor"
description = "Cursor collector: included usage and on-demand spend from the usage-summary endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
usage-model.workspace = true
usage-support.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `bundled` compiles SQLite with the toolchain Rust already needs, so the app never depends on a
# system sqlite3.dll. `hooks` provides the authorizer and progress handler that fence the
# read-only query. The default features (statement cache, wasm shim) stay off.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
