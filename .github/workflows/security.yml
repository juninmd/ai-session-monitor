name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'

# The reusable scan only needs to read the repo; the caller grants no more than that.
permissions:
  contents: read

jobs:
  scan:
    uses: juninmd/base-actions/.github/workflows/reusable-security-scan.yml@main
